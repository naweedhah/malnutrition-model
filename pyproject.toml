[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "component3"
version = "0.2.0"
description = "Adaptive Model Reliability Monitoring and Safe Maintenance Framework (Component 3)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=7.4", "httpx>=0.27", "fastapi>=0.115"]

[tool.setuptools.packages.find]
include = ["component3*"]
